[package]
name = "tare-loader-check"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
anyhow = "1"
serde_json = "1"
solana-syscalls = { version = "=4.4.0", default-features = false, features = ["agave-unstable-api"] }
solana-svm-feature-set = { version = "=4.4.0", default-features = false, features = ["agave-unstable-api"] }
solana-program-runtime = { version = "=4.4.0", default-features = false, features = ["agave-unstable-api"] }
solana-sbpf = "=0.24.0"
solana-sdk-ids = "3.1.0"
solana-pubkey = "4.1.0"
solana-svm-log-collector = { version = "=4.4.0", features = ["agave-unstable-api"] }

[patch.crates-io]
solana-sbpf = { path = "vendor/solana-sbpf" }
