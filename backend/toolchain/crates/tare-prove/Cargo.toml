[package]
name = "tare-prove"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
litesvm = "=0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account = "4.3.0"
solana-address = { version = "~2.7.0", features = ["curve25519", "serde", "copy"] }
solana-instruction = "~3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["serde"] }
syn = { version = "2", features = ["full"] }
quote = "1"
bincode = "1.3"
spl-token-interface = "=3.0.0"
solana-program-pack = "3.0.0"

[features]
trace = ["litesvm/register-tracing", "dep:solana-program-runtime", "dep:solana-transaction-context"]

[dependencies.solana-program-runtime]
version = "~4.3.2"
optional = true

[dependencies.solana-transaction-context]
version = "~4.3.2"
optional = true

[[example]]
name = "reference_compare"
required-features = ["trace"]

[dev-dependencies]
tare-opt = {path="../tare-opt"}

[[example]]
name = "trace_corpus"
required-features = ["trace"]
