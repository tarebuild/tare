[package]
name = "tare"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
tare-prove = { path = "../tare-prove" }
tare-opt = { path = "../tare-opt" }


reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
bincode = "1.3"
flate2 = "1"
solana-address = { version = "~2.7.0", features = ["curve25519", "serde", "copy"] }
solana-instruction = "~3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["serde"] }

syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
litesvm = "=0.18.2"
solana-account = "4.3.0"
