[package]
name = "anchor-spl"
version = "0.31.1"
edition = "2021"
license = "Apache-2.0"
description = "Tare SPL account views and cross-program invocation wrappers"

[features]
default = ["associated_token", "mint", "token", "token_2022", "token_2022_extensions"]
anchor-debug = ["anchor-lang/anchor-debug"]
associated_token = ["dep:spl-associated-token-account"]
devnet = []
governance = []
idl-build = ["anchor-lang/idl-build"]
memo = ["dep:spl-memo"]
metadata = ["dep:mpl-token-metadata", "dep:spl-associated-token-account"]
mint = []
stake = []
token = ["dep:spl-token"]
token_2022 = ["dep:spl-token-2022", "dep:spl-token"]
token_2022_extensions = ["token_2022", "dep:spl-token-group-interface", "dep:spl-token-metadata-interface", "dep:spl-pod"]

[dependencies]
anchor-lang = { path = "../tare-lang", version = "0.31.1", features = ["derive"] }
mpl-token-metadata = { version = "5", optional = true }
spl-associated-token-account = { version = "6", features = ["no-entrypoint"], optional = true }
spl-memo = { version = "6", features = ["no-entrypoint"], optional = true }
spl-token = { version = "7", features = ["no-entrypoint"], optional = true }
spl-token-2022 = { version = "6", features = ["no-entrypoint"], optional = true }
spl-token-group-interface = { version = "0.5", optional = true }
spl-token-metadata-interface = { version = "0.6", optional = true }
spl-pod = { version = "0.5", optional = true }
