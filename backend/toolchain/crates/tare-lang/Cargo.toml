[package]
name = "anchor-lang"
version = "0.31.1"
edition = "2021"
license = "Apache-2.0"
description = "Tare's dependency-compatible Anchor language runtime"
[features]
default = []
init-if-needed = []
derive = []
anchor-debug = []
idl-build = []
event-cpi = []
allow-missing-optionals = []
interface-instructions = []
lazy-account = []
[dependencies]
tare-lang-macros = { path = "../tare-lang-macros" }
borsh = "0.10.4"
bytemuck = "1"
bincode = "1.3"
solana-program = "2.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(tare_sdk)', 'cfg(tare_external_entry)'] }
